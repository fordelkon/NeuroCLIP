_target_: src.models.clipv1_module.ClipV1LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0002
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  factor: 0.1
  patience: 10
  mode: min

eegnet:
  _target_: src.models.components.simple_nice.FlattenProjEEG
  num_channels: ${channel_count:${data.selected_channels},63}
  time_points: 250
  proj_dim: ${clip_dim:${data.model_name}}
  p: 0.5

kgnet:
  _target_: src.models.components.graph_smoothing.GraphAttentionSmoothing
  embed_dim: ${clip_dim:${data.model_name}}
  n_heads: 1
  dropout: 0.3
  use_kg_scores: true

retrieval_k_list: [2, 4, 10, 200]
modality: eeg2img
loss_type: cliploss
alpha: 0.99

# Knowledge graph smoothing
enable_kg_smooth: true
kg_lambda: 0.01
kg_save_dir: ${build_kg.save_dir}
kg_k: ${build_kg.k}
kg_n_neighbors: 5

# compile model for faster training with pytorch 2.0
compile: false
