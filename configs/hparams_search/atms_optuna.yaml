# @package _global_

# hyperparameter optimization for ATMS model with Optuna:
# python train.py -m hparams_search=atms_optuna experiment=atms_experiment

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: "val/top1_acc_best"

hydra:
  mode: "MULTIRUN"

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null
    study_name: null
    n_jobs: 1
    direction: maximize
    n_trials: 20

    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      n_startup_trials: 10

    params:
      model.optimizer.lr: interval(0.0001, 0.001)
      model.optimizer.weight_decay: interval(0.00001, 0.001)
      model.eegnet.nhead: choice(1, 2, 5, 10)
      model.eegnet.num_layers: choice(1, 2, 3)
      model.eegnet.ts_filters: choice(32, 40, 64)
      model.eegnet.p: interval(0.3, 0.7)
