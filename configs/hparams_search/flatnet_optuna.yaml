# @package _global_

# hyperparameter optimization for FlatNet model with Optuna:
# python train.py -m hparams_search=flatnet_optuna experiment=flatnet_experiment

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: "val/top1_acc_best"

hydra:
  mode: "MULTIRUN"

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null
    study_name: null
    n_jobs: 1
    direction: maximize
    n_trials: 30

    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 20

    params:
      model.kgnet.n_heads: choice(1, 2, 4, 8)
      model.kgnet.dropout: choice(0.0, 0.1, 0.2, 0.5)
      model.kg_lambda: choice(0.01, 0.05, 0.1, 0.2, 0.3)
      model.kg_n_neighbors: choice(1, 3, 5, 7, 10)
