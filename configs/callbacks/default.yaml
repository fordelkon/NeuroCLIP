defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: ${monitor_metric:${model._target_}}
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: ${monitor_metric:${model._target_}}
  min_delta: 0.001
  patience: 10
  mode: "max"

model_summary:
  max_depth: -1
