_target_: src.preprocessors.thingseeg2.Thingseeg2Preprocessor

# THINGS-EEG2 subject id to preprocess, corresponding to sub-XX
subject_id: 1

# number of recording sessions for the subject
num_sessions: 4

# target EEG sampling rate after resampling
sfreq: 250

# epoch window in seconds
# downstream data keeps the post-stimulus [0, 1) window
tmin: -0.2
tmax: 1.0

# MVNN normalization dimension
# null uses the preprocessor default strategy
mvnn_dim: null

# input raw EEG and image directories, plus the preprocessed output directory
raw_data_dir: ${paths.thingseeg2_raw_dir}
img_data_dir: ${paths.thingseeg2_img_dir}
save_dir: ${paths.thingseeg2_preprocessed_dir}

# seed for processing steps that need deterministic randomness
seed: ${seed}
