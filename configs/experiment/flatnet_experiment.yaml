# @package _global_

# THINGS-EEG2 direct flatten-projection experiment.
# Run with:
# python train.py experiment=flatnet_experiment

defaults:
  - override /data: thingseeg2
  - override /model: flatnet
  - override /callbacks: default
  - override /trainer: default

tags: ["thingseeg2", "flatnet", "eeg2clip"]

seed: 12345
optimized_metric: "val/top1_acc_best"

logger:
  wandb:
    tags: ${tags}
    group: "thingseeg2_flatnet"
  aim:
    experiment: "thingseeg2_flatnet"
