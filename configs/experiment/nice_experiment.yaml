# @package _global_

# THINGS-EEG2 NICE experiment.
# Run with:
# python train.py experiment=nice_experiment

defaults:
  - override /extract: thingseeg2
  - override /build_kg: thingseeg2
  - override /data: thingseeg2
  - override /model: nice
  - override /callbacks: default
  - override /trainer: default

tags: ["thingseeg2", "nice", "eeg2clip"]

seed: 42
optimized_metric: ${optimized_metric:${model._target_}}

logger:
  wandb:
    tags: ${tags}
    group: "thingseeg2_nice"
  aim:
    experiment: "thingseeg2_nice"
